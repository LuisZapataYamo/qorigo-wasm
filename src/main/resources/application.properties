# ---------------------------------------------------------------------------
# QoriGo API
# ---------------------------------------------------------------------------
quarkus.application.name=qorigo-api
quarkus.http.port=8080
quarkus.http.limits.max-body-size=12M
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location
quarkus.http.test-port=8081

# --- Persistencia (H2 en desarrollo/pruebas; PostgreSQL en producción) -----
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:qorigo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=20

quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.jdbc.timezone=America/Lima

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=true

# --- Seguridad / JWT -------------------------------------------------------
mp.jwt.verify.publickey.location=keys/publicKey.pem
mp.jwt.verify.issuer=qorigo-api
smallrye.jwt.sign.key.location=keys/privateKey.pem

quarkus.http.auth.permission.public.paths=/,/auth/login,/auth/recuperar,/auth/restablecer,/q/openapi,/q/openapi/*,/q/swagger-ui,/q/swagger-ui/*,/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# --- Reglas configurables ---------------------------------------------------
qorigo.zona-horaria=America/Lima
qorigo.auth.max-intentos=5
qorigo.auth.ventana-bloqueo-minutos=15
qorigo.auth.horas-token=12
qorigo.auth.minutos-token-recuperacion=30
qorigo.auth.exponer-token-recuperacion=true

qorigo.seed-admin.enabled=true
qorigo.seed-admin.email=admin@qorigo.local
qorigo.seed-admin.password=Admin123!
qorigo.seed-admin.nombres=Administrador
qorigo.seed-admin.apellidos=QoriGo

# --- Jackson ---------------------------------------------------------------
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.fail-on-unknown-properties=false
quarkus.jackson.accept-case-insensitive-enums=true

# --- OpenAPI ---------------------------------------------------------------
quarkus.smallrye-openapi.info-title=QoriGo API
quarkus.smallrye-openapi.info-version=1.0.0

# --- Perfil de producción --------------------------------------------------
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:qorigo}
%prod.quarkus.datasource.password=${DB_PASSWORD:qorigo}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/qorigo}
%prod.qorigo.seed-admin.enabled=${SEED_ADMIN:false}
%prod.qorigo.auth.exponer-token-recuperacion=false
